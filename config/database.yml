# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("LEADPULSE_DB_NAME", "leadpulse_development") %>
  username: <%= ENV.fetch("LEADPULSE_DB_USER", "clacerda") %>
  password: <%= ENV.fetch("LEADPULSE_DB_PASSWORD", "123456") %>
  host: <%= ENV.fetch("LEADPULSE_DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("LEADPULSE_DB_PORT", 55432) %>

test:
  <<: *default
  database: leadpulse_test
  username: <%= ENV.fetch("LEADPULSE_DB_USER", "clacerda") %>
  password: <%= ENV.fetch("LEADPULSE_DB_PASSWORD", "123456") %>
  host: <%= ENV.fetch("LEADPULSE_DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("LEADPULSE_DB_PORT", 55432) %>

production:
  primary: &primary_production
    <<: *default
    database: leadpulse_production
    username: leadpulse
    password: <%= ENV["LEADPULSE_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: leadpulse_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: leadpulse_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: leadpulse_production_cable
    migrations_paths: db/cable_migrate
