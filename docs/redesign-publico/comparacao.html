<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeadPulse — comparação das telas públicas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font:16px/1.5 system-ui,sans-serif}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #d1d5db;padding:16px 24px;z-index:1}h1{font-size:20px;margin:0 0 8px}p{margin:8px 0}label{display:inline-flex;gap:8px;align-items:center;margin-right:20px}select{font:inherit;padding:6px;border:1px solid #6b7280;border-radius:6px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px}figure{margin:0;min-width:0}figcaption{font-weight:600;margin-bottom:12px}img{display:block;width:100%;height:auto;border:1px solid #d1d5db}a{color:#1d4ed8}:focus-visible{outline:3px solid #2563eb;outline-offset:3px}@media(max-width:700px){main{grid-template-columns:1fr}label{margin-bottom:8px}}
</style>
<header><h1>LeadPulse · antes e depois</h1>
<label>Tela <select id="page"><option value="login">Login</option><option value="cadastro">Cadastro</option><option value="landing" selected>Landing</option></select></label>
<label>Largura <select id="width"><option>390</option><option>1024</option><option selected>1440</option></select></label>
<label><input id="fold" type="checkbox" checked> Primeira dobra (1440 px)</label>
<p>Capturas reais do navegador. Clique em uma imagem para abrir no tamanho original. <a href="README.md">Relatório completo</a></p></header>
<main><figure><figcaption>Antes · 30faedd</figcaption><a id="before-link"><img id="before" alt="Tela antes do redesign"></a></figure><figure><figcaption>Depois · redesign público</figcaption><a id="after-link"><img id="after" alt="Tela depois do redesign"></a></figure></main>
<script>
const page=document.querySelector('#page'),width=document.querySelector('#width'),fold=document.querySelector('#fold');
function render(){fold.disabled=width.value!=='1440';const suffix=width.value==='1440'&&fold.checked?'-viewport':'';for(const [id,phase] of [['before','antes'],['after','depois']]){const src=`screenshots/${phase}/${page.value}-${width.value}${suffix}.jpg`;document.getElementById(id).src=src;document.getElementById(id).alt=`${page.selectedOptions[0].text} ${phase}, ${width.value} pixels`;document.getElementById(id+'-link').href=src}}
for(const control of [page,width,fold])control.addEventListener('change',render);render();
</script></html>
